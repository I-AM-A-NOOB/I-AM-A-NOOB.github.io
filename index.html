<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StarWarp · 星际跃迁 — 班级高校分布图</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <aside id="sidebar-left"></aside>
    <aside id="sidebar-right"></aside>

    <svg id="conn-lines"></svg>

    <header id="hud-top">
      <h1>StarWarp <span>· 星际跃迁</span></h1>
    </header>

    <aside id="panel">
      <div class="panel-head">
        <h2 id="panel-title">全国概览</h2>
        <button id="panel-action" class="btn-panel">重置视角</button>
      </div>
      <div id="panel-body">
      </div>
    </aside>

    <div id="loader">加载地图数据…</div>
  </div>

  <!-- 用户可编辑配置（普通脚本，先于模块执行） -->
  <script src="js/config.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
